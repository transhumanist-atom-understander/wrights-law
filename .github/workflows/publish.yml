name: Publish article

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown
            any::scales
            any::tidyverse
            any::ggrepel
            any::owidapi
            any::robustbase
            any::broom

      # Runs the R script, which downloads the data from Our World in Data
      - run: quarto render

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # Plain markdown copy of the article, matching what is in the LessWrong
      # Markdown editor: no title, and the figure replaced by the copy that
      # LessWrong hosts.
      - name: Render markdown
        env:
          FIGURE: "![](https://res.cloudinary.com/lesswrong-2-0/image/upload/v1794808276/lexical_client_uploads/jzd7qn35oabs0dlfb5a3.png)"
        run: |
          quarto render index.qmd --to gfm --output-dir _markdown -M title:false
          sed '/./,$!d' _markdown/index.md |
            perl -0pe '$n = s/<img\b.*?\/>/$ENV{FIGURE}/s; END { exit($n == 1 ? 0 : 1) }' > index.md

      # Pushes made with GITHUB_TOKEN do not start another workflow run
      - name: Commit markdown
        run: |
          git add index.md
          if git diff --cached --quiet; then
            echo "index.md is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Render index.md"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
